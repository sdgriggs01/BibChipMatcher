[project]
name = "bibchipmatcher"
version = "0.1.0"
description = "Assigns timing chips to cross-country athletes from a team roster spreadsheet and generates HyTek entries."
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "requests",
    "openpyxl",
    "reportlab",
]

[project.optional-dependencies]
dev = [
    "coverage",
    "mypy",
    "pandas-stubs",
    "types-requests",
]
build = [
    "pyinstaller",
]

[project.scripts]
bibchipmatcher = "gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "gui"]
packages = ["utils"]
